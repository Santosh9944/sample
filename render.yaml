services:
  - type: web
    name: verifai
    runtime: python
    buildCommand: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --timeout 180 --preload
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
